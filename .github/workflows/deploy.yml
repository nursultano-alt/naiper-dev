name: Build, Test and Deploy to Cloudflare

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build, Verify and Deploy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Integration Tests
        run: node test_portal_sync.mjs

      - name: Build Production Bundle (dist)
        run: node build_dist.mjs

      - name: Upload Production Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-production-bundle
          path: |
            dist/
            dist_production_bundle.zip
          retention-days: 30

      - name: Deploy to Cloudflare (Wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "🚀 Deploying to Cloudflare via Wrangler..."
            npm install -g wrangler
            npx wrangler deploy
          else
            echo "::warning title=Cloudflare Token Missing::Секрет CLOUDFLARE_API_TOKEN не настроен в репозитории GitHub. Бандл успешно собран и сохранен в Artifacts."
            echo "### ⚠️ Cloudflare Deployment Notice" >> $GITHUB_STEP_SUMMARY
            echo "Для автоматического обновления живого домена **naiper.dev** через GitHub Actions:" >> $GITHUB_STEP_SUMMARY
            echo "1. Откройте: https://github.com/nursultano-alt/naiper-dev/settings/secrets/actions" >> $GITHUB_STEP_SUMMARY
            echo "2. Добавьте секрет **CLOUDFLARE_API_TOKEN**" >> $GITHUB_STEP_SUMMARY
            echo "Либо выполните деплой в 1 клик с локального ПК через **deploy_prod.bat**." >> $GITHUB_STEP_SUMMARY
          fi
